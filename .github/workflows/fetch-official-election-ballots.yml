name: Fetch official election ballots

on:
  push:
    paths:
      - 'research/fetch_official_election_ballots.py'
      - '.github/workflows/fetch-official-election-ballots.yml'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pandas requests
      - run: python research/fetch_official_election_ballots.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-election-ballots
          path: research/official_ballots/
          if-no-files-found: error
          retention-days: 7
