name: Shas hybrid city and ballot analysis v2

on:
  push:
    paths:
      - 'research/run_shas_hybrid_analysis.py'
      - 'research/analyze_shas_hybrid_ballots.py'
      - '.github/workflows/shas-hybrid-analysis-v2.yml'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --quiet numpy pandas requests scipy
      - name: Run corrected hybrid analysis
        run: python research/run_shas_hybrid_analysis.py
      - name: Upload analysis files
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shas-hybrid-analysis-v2
          path: research/hybrid_output/
          if-no-files-found: warn
          retention-days: 7
