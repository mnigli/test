name: Shas research inspect

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/shas-inspect.yml'
      - 'research/inspect_shas_data.py'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Run inspection
        run: uv run research/inspect_shas_data.py
      - name: Upload output
        uses: actions/upload-artifact@v4
        with:
          name: shas-inspection
          path: research/output/
          retention-days: 3
